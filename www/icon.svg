<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0a0a0a"/>
  <!-- Outer glow -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#b01c1c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="25%">
      <stop offset="0%" stop-color="#fff8e7" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#d4a843" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="120" fill="url(#starGlow)"/>
  <!-- Star burst -->
  <g transform="translate(256,256)" stroke="#d4a843" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <line x1="0" y1="-90" x2="0" y2="-45"/>
    <line x1="0" y1="45" x2="0" y2="90"/>
    <line x1="-90" y1="0" x2="-45" y2="0"/>
    <line x1="45" y1="0" x2="90" y2="0"/>
    <line x1="-64" y1="-64" x2="-32" y2="-32"/>
    <line x1="32" y1="32" x2="64" y2="64"/>
    <line x1="64" y1="-64" x2="32" y2="-32"/>
    <line x1="-32" y1="32" x2="-64" y2="64"/>
  </g>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="6" fill="#fff8e7"/>
  <circle cx="256" cy="256" r="3" fill="#ffffff"/>
  <!-- Fissures -->
  <g stroke="#b01c1c" stroke-width="1" opacity="0.5" fill="none" stroke-linecap="round">
    <path d="M256,250 L240,220 L235,190"/>
    <path d="M260,256 L280,240 L300,235"/>
    <path d="M254,262 L240,280 L238,310"/>
  </g>
  <!-- E.T.I text -->
  <text x="256" y="440" text-anchor="middle" font-family="serif" font-size="28" fill="#d4a843" opacity="0.6" letter-spacing="8">E.T.I.</text>
</svg>
