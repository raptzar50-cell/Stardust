<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable icon: safe zone is inner 80% circle -->
  <rect width="512" height="512" fill="#0a0a0a"/>
  <defs>
    <radialGradient id="mg" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#fff8e7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#d4a843" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="140" fill="url(#mg)"/>
  <g transform="translate(256,256)" stroke="#d4a843" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="0" y1="-70" x2="0" y2="-35"/>
    <line x1="0" y1="35" x2="0" y2="70"/>
    <line x1="-70" y1="0" x2="-35" y2="0"/>
    <line x1="35" y1="0" x2="70" y2="0"/>
    <line x1="-50" y1="-50" x2="-25" y2="-25"/>
    <line x1="25" y1="25" x2="50" y2="50"/>
    <line x1="50" y1="-50" x2="25" y2="-25"/>
    <line x1="-25" y1="25" x2="-50" y2="50"/>
  </g>
  <circle cx="256" cy="256" r="8" fill="#fff8e7"/>
  <circle cx="256" cy="256" r="4" fill="#ffffff"/>
</svg>
