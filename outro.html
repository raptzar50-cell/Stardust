<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E LIT — Outro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }

    /* Full-screen video */
    #outroVideo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Skip hint — bottom centre */
    #skipHint {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transition: opacity 1.2s ease;
      pointer-events: none;
    }
    #skipHint.visible { opacity: 1; }

    .skip-key {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.55);
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }
    .skip-key kbd {
      display: inline-block;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 10px;
      font-family: inherit;
      color: rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.05);
    }

    /* First-press feedback bar */
    #spaceBar {
      width: 80px;
      height: 2px;
      background: rgba(255,255,255,0.15);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }
    #spaceBarFill {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.6);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.25s ease;
    }
    #spaceBar.half #spaceBarFill { transform: scaleX(1); }

    /* Fade-out overlay */
    #fadeOut {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    #fadeOut.active { opacity: 1; pointer-events: all; }
  </style>
</head>
<body>

  <video
    id="outroVideo"
    src="ok.mp4"
    playsinline
    preload="auto"
  ></video>

  <!-- skip hint -->
  <div id="skipHint" class="visible">
    <div class="skip-key">
      <kbd>SPACE</kbd>
      <span>play / pause</span>
      <span style="opacity: 0.4; margin: 0 4px;">|</span>
      <kbd>ENTER</kbd>
      <span>skip</span>
    </div>
  </div>

  <!-- black fade-to-next overlay -->
  <div id="fadeOut"></div>

  <script>
    const video    = document.getElementById('outroVideo');
    const skipHint = document.getElementById('skipHint');
    const fadeOut  = document.getElementById('fadeOut');

    // Make sure video is paused on initial load
    video.pause();

    document.addEventListener('click', () => {
      video.muted = false;
      if (video.paused) {
        video.play().catch(e => console.log(e));
      } else {
        video.pause();
      }
    });

    /* ── navigate when video naturally ends ── */
    video.addEventListener('ended', goNext);

    /* ── Keyboard controls: SPACE = play/pause toggle, ENTER = skip ── */
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.key === ' ' || e.keyCode === 32) {
        e.preventDefault();
        video.muted = false;
        if (video.paused) {
          video.play().catch(err => console.log(err));
        } else {
          video.pause();
        }
      } else if (e.code === 'Enter' || e.key === 'Enter' || e.keyCode === 13) {
        e.preventDefault();
        video.muted = false;
        goNext();
      }
    });

    function goNext() {
      if (goNext._done) return;
      goNext._done = true;
      video.pause();
      localStorage.setItem('akira_unlocked', 'true');
      fadeOut.classList.add('active');
      setTimeout(() => {
        window.location.href = 'akira-index.html';
      }, 650);
    }

    // ── SECRET: double-click screen → login page ──
    document.addEventListener('dblclick', function(e) {
      e.preventDefault();
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
