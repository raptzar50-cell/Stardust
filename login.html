<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E.T.I. — RESTRICTED ACCESS</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,400i,700" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=VT323" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />

  <style>
    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── ANIMATIONS ── */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes descend {
      from { top: 45%; }
      to   { top: 50%; }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0) translateY(-50%); }
      20%     { transform: translateX(-10px) translateY(-50%); }
      40%     { transform: translateX(10px) translateY(-50%); }
      60%     { transform: translateX(-7px) translateY(-50%); }
      80%     { transform: translateX(7px) translateY(-50%); }
    }

    body { margin: 0; padding: 0; background: #111; overflow-x: hidden; }

    /* ── WRAPPER ── */
    .wrapper {
      margin: 0 auto;
      width: 100%;
      min-height: 100vh;
      position: relative;
    }

    /* ── LOGIN PAGE ── */
    .login-page,
    .home-page {
      position: absolute;
      inset: 0;
      width: 100%;
      min-height: 100vh;
    }

    .login-page {
      background-image: url("http://res.cloudinary.com/mmdirir94/image/upload/v1519167949/architecture-3121009_960_720_lix21u.jpg");
      background-position: center;
      background-repeat: no-repeat;
      background-color: black;
      background-size: cover;
      font-size: 16px;
      z-index: 3;
    }

    /* dark tint over the photo */
    .login-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
    }

    /* scanlines */
    .login-page::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.07) 3px,
        rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
    }

    /* ── LOGIN INNER ── */
    .login-page-inner {
      width: 400px;
      position: relative;
      top: 50%;
      transform: translateY(-50%);
      margin: 0 auto;
      animation: fadeIn 1s ease-in-out, descend 0.5s ease-in-out;
      z-index: 2;
    }

    /* shake state applied via JS */
    .login-page-inner.is-shaking {
      animation: shake 0.45s ease forwards;
    }

    /* ── USER ICON ── */
    #user-icon-container,
    #username-container,
    #input-container {
      text-align: center;
    }

    #user-icon-container {
      margin: 0 auto;
      width: 140px;
      height: 140px;
      font-size: 110%;
      position: relative;
    }

    .user-icon-bg {
      margin: 0 auto;
      width: 140px;
      height: 140px;
      border-radius: 100%;
      background-color: white;
      opacity: 0.3;
      position: relative;
      z-index: -1;
    }

    .fa-user-o {
      position: relative;
      top: -115px;
      z-index: 2;
      color: white;
      font-size: 72px;
    }

    /* ── USERNAME ── */
    #username-container {
      margin-bottom: 40px;
      margin-top: 20px;
      font-family: "Roboto", sans-serif;
      font-size: 105%;
      color: white;
      letter-spacing: 0.1em;
    }
    #username-container small {
      display: block;
      font-size: 9px;
      letter-spacing: 0.3em;
      color: rgba(255,255,255,0.3);
      margin-top: 5px;
      text-transform: uppercase;
    }

    /* ── INPUT CONTAINER ── */
    #input-container {
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #password {
      margin: 0;
      height: 31px;
      width: 260px;
      padding-left: 10px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.25);
      border-right: none;
      color: #fff;
      font-family: monospace;
      font-size: 13px;
      outline: none;
    }
    #password::placeholder { color: rgba(255,255,255,0.3); }

    #submit {
      height: 31px;
      padding: 0 14px;
      position: relative;
      right: 0;
      background-color: #bdbdbd;
      border: none;
      border-radius: 0 2px 2px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }
    #submit .fa-arrow-right {
      line-height: 28px;
      color: white;
    }
    #submit:hover { background-color: #9e9e9e; }
    #submit.success { background-color: #2e7d32 !important; }

    /* ── ERROR MSG ── */
    #error-msg {
      text-align: center;
      margin-top: 16px;
      font-family: 'Roboto', monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #ef5350;
      height: 16px;
      opacity: 0;
      transition: opacity 0.25s;
    }
    #error-msg.visible { opacity: 1; }

    /* ── CLASSIFICATION STRIP ── */
    .login-classification {
      position: absolute;
      bottom: 16px;
      left: 0; right: 0;
      text-align: center;
      font-family: monospace;
      font-size: 9px;
      letter-spacing: 0.28em;
      color: rgba(255,255,255,0.15);
      text-transform: uppercase;
      z-index: 2;
    }

    /* ── SUCCESS GLITCH PAGE ── */
    .home-page {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      background: #111;
      overflow: hidden;
    }
    .home-page.visible {
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.8s ease-in-out;
    }

    /* ── GLITCH STYLES (from provided SCSS) ── */
    #root {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translateY(-50%) translateX(-50%);
      z-index: 100;
      width: 90%;
      text-align: center;
    }

    /* ── GLITCH TEXT STACK ── */
    .text-stack {
      position: relative;
      width: 100%;
      transition: opacity 0.4s ease;
    }
    .text-stack.slide-break {
      opacity: 0;
    }

    .text-main,
    .text-ghost {
      font-family: 'VT323', monospace;
      text-transform: uppercase;
      font-size: clamp(17px, 2.3vw, 32px);
      font-weight: normal;
      line-height: 1.45;
      margin: 0;
      letter-spacing: 0.01em;
    }

    .text-main {
      position: relative;
      color: red;
      mix-blend-mode: screen;
      filter: blur(1.6px);
      text-shadow: 0 0 3px rgba(255,0,0,0.5);
      animation: skew 2s infinite, flash 0.04s infinite;
      z-index: 2;
    }

    .text-ghost {
      position: absolute;
      inset: 0;
      mix-blend-mode: screen;
      pointer-events: none;
      filter: blur(0.8px);
      z-index: 1;
    }
    /* force ghosts to a single flat tint, regardless of colored spans inside */
    .text-ghost.blue,
    .text-ghost.blue *  { color: blue; }
    .text-ghost.green,
    .text-ghost.green * { color: limegreen; }

    .text-ghost.blue {
      top: 0;
      left: 6px;
      animation: move 1.5s infinite;
    }
    .text-ghost.green {
      top: -2.4px;
      left: 3.6px;
    }

    /* multi-line slides: force real block spacing so lines can't overlap */
    .slide-line {
      display: block;
    }
    .slide-line + .slide-line {
      margin-top: 0.55em;
    }

    /* highlighted words / lines within a slide */
    .hl-blue   { color: #4fa8ff; }
    .hl-red    { color: #ff1744; }

    /* ERROR slide */
    .text-stack.error-slide .text-main {
      color: #ff1744;
      font-size: clamp(22px, 3vw, 42px);
      letter-spacing: 0.08em;
      animation: skew 2s infinite, flash 0.04s infinite, errorPulse 0.6s infinite;
    }
    .text-stack.error-slide .text-ghost {
      font-size: clamp(22px, 3vw, 42px);
      letter-spacing: 0.08em;
    }
    .text-stack.error-slide .text-ghost.blue,
    .text-stack.error-slide .text-ghost.blue *  { color: #ff8a80; }
    .text-stack.error-slide .text-ghost.green,
    .text-stack.error-slide .text-ghost.green * { color: #ff1744; }

    @keyframes errorPulse {
      0%, 100% { text-shadow: 0 0 6px rgba(255,23,68,0.8); }
      50%      { text-shadow: 0 0 18px rgba(255,23,68,1); }
    }

    .line {
      position: absolute;
      left: 0;
      right: 0;
      width: 100%;
      height: 1px;
      background: blue;
      mix-blend-mode: screen;
      filter: blur(1px);
      pointer-events: none;
      z-index: 99;
    }

    .line::after,
    .line::before {
      content: '';
      position: absolute;
      left: 0;
      width: 100%;
      height: 1px;
      mix-blend-mode: screen;
    }

    .line::after {
      top: 2px;
      background: red;
    }

    .line::before {
      top: -2px;
      background: limegreen;
    }

    @keyframes skew {
      0%    { transform: none; }
      30%   { transform: none; }
      30.2% { transform: skewX(50deg); }
      30.4% { transform: skewX(-50deg); }
      31%   { transform: none; }
    }

    @keyframes move {
      0%   { transform: none; }
      30%  { transform: none; }
      31%  { transform: translateX(-6px); }
      33%  { transform: none; }
      98%  { transform: none; }
      100% { transform: translateX(6px); }
    }

    @keyframes flash {
      0%   { opacity: 1; }
      50%  { opacity: 0.5; }
    }

    @keyframes lines {
      0%   { opacity: 0.1; }
      50%  { opacity: 1; }
    }

    /* ── MOBILE ── */
    @media (min-width: 340px) and (max-width: 529px) {
      .login-page-inner { width: 280px !important; }

      #user-icon-container {
        width: 120px !important;
        height: 120px !important;
      }
      .user-icon-bg { width: 120px !important; height: 120px !important; }
      .fa-user-o    { top: -100px !important; }

      #password { width: 180px !important; }
      #submit    { height: 31px !important; }
    }
  </style>
</head>
<body>

<div class="wrapper">

  <!-- ── LOGIN PAGE ── -->
  <div class="login-page" id="login-page">

    <div class="login-page-inner" id="login-inner">

      <div id="user-icon-container">
        <div class="user-icon-bg"></div>
        <i class="fa fa-user-o" aria-hidden="true"></i>
      </div>

      <div id="username-container">
        Dr. Mary Clark
        <small>E.T.I. — Restricted Access</small>
      </div>

      <div id="input-container">
        <input
          type="password"
          id="password"
          placeholder="Access code…"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="submit" onclick="submitPassword()" aria-label="Submit">
          <i class="fa fa-arrow-right"></i>
        </button>
      </div>

      <div id="error-msg">ACCESS DENIED — INVALID CREDENTIALS</div>

    </div>

    <div class="login-classification">
      Eastbrook Therapeutic Institute &nbsp;·&nbsp; ETI-ARCH-2024 &nbsp;·&nbsp; Restricted
    </div>

  </div><!-- /login-page -->

  <!-- ── SUCCESS / GLITCH PAGE ── -->
  <div class="home-page" id="home-page">
    <div id="root">
      <div class="text-stack" id="text-stack">
        <div class="text-main" id="text"></div>
        <div class="text-ghost blue" id="text-ghost-blue" aria-hidden="true"></div>
        <div class="text-ghost green" id="text-ghost-green" aria-hidden="true"></div>
      </div>
    </div>
  </div>

</div><!-- /wrapper -->

<audio id="bgm" src="rei.mp3" preload="auto" loop></audio>

<script>
  const CORRECT = 'RealYou.EXE';

  function getHeight() {
    return window.innerHeight
      || document.documentElement.clientHeight
      || document.body.clientHeight;
  }

  function drawLines() {
    const lines = document.getElementsByClassName('line');
    while (lines.length > 0) {
      lines[0].parentNode.removeChild(lines[0]);
    }
    
    const numLines = Math.floor(getHeight() / 10);
    for (let i = 0; i < numLines; i++) {
      const line = document.createElement("div");  
      line.className = `line line-${i}`;
      line.style.top = `${i * 10}px`;
      const time = Math.random() * 5 + 0.5;
      line.style.animation = `lines ${time}s infinite`;
      document.body.appendChild(line);
    }
  }

  window.onresize = function() {
    if (document.getElementById('home-page').classList.contains('visible')) {
      drawLines();
    }
  };

  /* ── SLIDESHOW ── */
  const slides = [
    {
      html: '<span class="slide-line">Why do you <span class="hl-blue">&ldquo;help&rdquo;</span> them?</span><span class="slide-line hl-red">cause i like to help</span>',
      text: 'Why do you "help" them? cause i like to help',
      duration: 8000
    },
    {
      html: '<span class="slide-line">then what about your life?</span><span class="slide-line hl-red">what about it?</span>',
      text: 'then what about your life? what about it?',
      duration: 8000
    },
    {
      html: "Don't you chase the ghost?",
      text: "Don't you chase the ghost?",
      duration: 8000
    },
    {
      html: 'Ghost of your father',
      text: 'Ghost of your father',
      duration: 8000
    },
    {
      html: '',
      text: '',
      duration: 2200,
      isBreak: true
    },
    {
      html: 'she felt powerless',
      text: 'she felt powerless',
      duration: 8000
    },
    {
      html: 'your perfect father was flawed',
      text: 'your perfect father was flawed',
      duration: 8000
    },
    {
      html: '&#9888; ERROR',
      text: '! ERROR',
      duration: null,
      isError: true
    }
  ];

  function playSlides(index) {
    const stack      = document.getElementById('text-stack');
    const textEl     = document.getElementById('text');
    const ghostBlue  = document.getElementById('text-ghost-blue');
    const ghostGreen = document.getElementById('text-ghost-green');
    if (index >= slides.length) return;

    const slide = slides[index];

    // brief fade-out before swapping content
    stack.classList.add('slide-break');

    setTimeout(function () {
      stack.classList.remove('slide-break', 'error-slide');

      if (slide.isError) {
        stack.classList.add('error-slide');
      }
      if (slide.isBreak) {
        stack.classList.add('slide-break');
      }

      // identical markup on all three layers so wrapping always matches exactly
      textEl.innerHTML     = slide.html;
      ghostBlue.innerHTML  = slide.html;
      ghostGreen.innerHTML = slide.html;

      if (slide.duration !== null) {
        setTimeout(function () {
          playSlides(index + 1);
        }, slide.duration);
      }
      // isError slide has no duration → it stays as the final state
    }, 350);
  }

  function submitPassword() {
    var pw         = document.getElementById('password').value;
    var loginPage  = document.getElementById('login-page');
    var homePage   = document.getElementById('home-page');
    var submitBtn  = document.getElementById('submit');
    var errorMsg   = document.getElementById('error-msg');
    var loginInner = document.getElementById('login-inner');

    if (pw === CORRECT) {
      // correct — green button → fade out login → show glitch message & lines
      errorMsg.classList.remove('visible');

      setTimeout(function () {
        submitBtn.classList.add('success');
      }, 300);

      setTimeout(function () {
        loginPage.style.transition = 'opacity 0.6s ease';
        loginPage.style.opacity = '0';
      }, 800);

      setTimeout(function () {
        loginPage.style.display = 'none';
        homePage.classList.add('visible');
        drawLines();

        var bgm = document.getElementById('bgm');
        bgm.volume = 0.85;
        bgm.currentTime = 0;
        bgm.play().catch(function () {
          // autoplay blocked — will resume on next user interaction
          document.addEventListener('click', function resumeAudio() {
            bgm.play();
            document.removeEventListener('click', resumeAudio);
          }, { once: true });
        });

        playSlides(0);
      }, 1400);

    } else {
      // wrong — shake + error message
      errorMsg.classList.add('visible');

      loginInner.classList.remove('is-shaking');
      void loginInner.offsetWidth; // reflow
      loginInner.classList.add('is-shaking');
      loginInner.addEventListener('animationend', function () {
        loginInner.classList.remove('is-shaking');
      }, { once: true });

      document.getElementById('password').value = '';

      setTimeout(function () {
        errorMsg.classList.remove('visible');
      }, 2200);
    }
  }

  /* ── keydown listener ── */
  document.addEventListener('keydown', formValidation);

  function formValidation(e) {
    if (13 === e.keyCode) {
      submitPassword();
    }
    // ESC → back to chapter 1
    if (27 === e.keyCode) {
      window.location.href = 'chapter1.html';
    }
  }

  // Auto-focus password on load
  window.addEventListener('load', function () {
    document.getElementById('password').focus();
  });
</script>

</body>
</html>
