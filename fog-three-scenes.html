<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fog</title>
  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
  }
}
</script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity 2s ease;
    }

    .scene.active {
      opacity: 1;
      visibility: visible;
    }

    /* ---------- Scene 1: fog wipe ---------- */
    #scene1 .container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #fogCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    #scene1 .text-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #000;
      font-size: 2em;
      text-align: center;
      opacity: 0;
      transition: opacity 1s;
      pointer-events: none;
    }

    /* ---------- Scene 2 & 3: shader canvases ---------- */
    #scene2,
    #scene3 {
      background: #000;
    }

    #shader2,
    #shader3 {
      position: absolute;
      inset: 0;
    }

    #shader2 canvas,
    #shader3 canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* ---------- Scene 3: typewriter poem ---------- */
    #poem-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 20px;
      pointer-events: none;
    }

    #poem-overlay .line {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(16px, 2.4vw, 26px);
      text-align: center;
      text-shadow: 0 0 12px rgba(0, 0, 0, 0.7);
      opacity: 0;
      letter-spacing: 0.02em;
    }

    #poem-overlay .line.visible {
      opacity: 1;
    }

    #poem-overlay .line.color-white {
      color: #fff;
    }

    #poem-overlay .line.color-red {
      color: #e63b3b;
      text-shadow: 0 0 12px rgba(0, 0, 0, 0.85);
    }

    #poem-overlay .line.color-black {
      color: #111;
      font-family: 'Shadows Into Light', cursive;
      font-size: clamp(20px, 3vw, 32px);
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.55), 0 0 2px rgba(255, 255, 255, 0.4);
    }

    #poem-overlay .caret {
      display: inline-block;
      width: 2px;
      background: currentColor;
      animation: blink 1s step-end infinite;
      margin-left: 2px;
      height: 1em;
      vertical-align: text-bottom;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* ---------- Flash overlay (scene begin/end flicker) ---------- */
    #flash-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
    }

    #flash-overlay img {
      max-width: 78vw;
      max-height: 78vh;
      object-fit: contain;
      filter: contrast(1.05);
    }
  </style>
</head>

<body>

  <!-- Autoplay audio -->
  <audio id="fogMusic" autoplay loop preload="auto">
    <source src="Angel's Stardust/21. lost..mp3" type="audio/mpeg">
    <source src="Angel%27s%20Stardust/21.%20lost..mp3" type="audio/mpeg">
  </audio>
  <script>
    (function () {
      var m = document.getElementById('fogMusic');
      if (m) {
        m.play().catch(function () {
          document.addEventListener('click', function u() { m.play(); document.removeEventListener('click', u); }, { once: true });
        });
      }
    })();
  </script>

  <!-- ================= FLASH OVERLAY ================= -->
  <div id="flash-overlay"><img id="flash-img" src="" alt=""></div>

  <!-- ================= SCENE 1 : FOG WIPE ================= -->
  <section id="scene1" class="scene active">
    <div class="container">
      <canvas id="fogCanvas"></canvas>
      <div class="text-overlay"><span id="message">gently wipe the fog away sometimes ,the fog makes it hard to see
          but maybe thats why it exist , like the mist
          its there to make you forget what happened</span></div>
    </div>
  </section>

  <!-- ================= SCENE 2 : RIPPLE SHADER (no text) ================= -->
  <section id="scene2" class="scene">
    <div id="shader2"></div>
  </section>

  <!-- ================= SCENE 3 : TUNNEL SHADER + POEM ================= -->
  <section id="scene3" class="scene">
    <div id="shader3"></div>
    <div id="poem-overlay"></div>
  </section>

  <script type="module">
    import * as THREE from "three";

    /* ============================================================
       SCENE MANAGER
       ============================================================ */
    const scenes = {
      s1: document.getElementById('scene1'),
      s2: document.getElementById('scene2'),
      s3: document.getElementById('scene3'),
    };

    function goTo(sceneKey) {
      Object.values(scenes).forEach(el => el.classList.remove('active'));
      scenes[sceneKey].classList.add('active');
    }
    scenes.s1.classList.remove('active'); // hidden until opening flash completes

    /* ============================================================
       FLASH OVERLAY — quick flicker of the uploaded drawings,
       used at the start/end of every scene transition
       ============================================================ */
    const FLASH_IMAGES = ['img/1.png', 'img/2.png', 'img/3.png', 'img/4.png', 'img/5.png', 'img/6.png'];

    const flashOverlay = document.getElementById('flash-overlay');
    const flashImg = document.getElementById('flash-img');

    function shuffled(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function flashImages(count, frameMs, callback) {
      const seq = shuffled(FLASH_IMAGES).slice(0, count);
      flashOverlay.style.transition = 'none';
      flashOverlay.style.opacity = '1';
      flashOverlay.style.pointerEvents = 'auto';

      let i = 0;
      function frame() {
        if (i >= seq.length) {
          flashOverlay.style.transition = 'opacity 90ms ease';
          flashOverlay.style.opacity = '0';
          flashOverlay.style.pointerEvents = 'none';
          setTimeout(() => callback && callback(), 100);
          return;
        }
        flashImg.src = seq[i];
        // quick on/off flicker within each frame for a "flashy" strobe feel
        flashImg.style.opacity = '1';
        setTimeout(() => { flashImg.style.opacity = '0.35'; }, frameMs * 0.75);
        i++;
        setTimeout(frame, frameMs);
      }
      frame();
    }

    /* transition wrapper: flash, then switch scene, used at every boundary */
    function transitionTo(sceneKey, count) {
      flashImages(count || 3, 280, () => goTo(sceneKey));
    }

    // opening flash before scene 1 appears
    transitionTo('s1', 4);

    /* ============================================================
       SCENE 1 — FOG WIPE (canvas + pointer erase)
       ============================================================ */
    (function fogScene() {
      const canvas = document.getElementById('fogCanvas');
      const ctx = canvas.getContext('2d');
      const message = document.getElementById('message');
      let particles = [];
      let isDrawing = false;
      let clearedRatio = 0;
      let advanced = false;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      function initParticles() {
        particles = [];
        const count = 60;
        for (let i = 0; i < count; i++) {
          const size = 150 + Math.random() * 150;
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: size,
            alpha: 0.08 + Math.random() * 0.12,
            vx: (Math.random() - 0.5) * 0.2,
            vy: (Math.random() - 0.5) * 0.2
          });
        }
      }
      initParticles();

      function drawFog() {
        if (!scenes.s1.classList.contains('active')) {
          return; // scene left for good — stop scheduling frames
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          if (p.alpha <= 0) return;
          const grad = ctx.createRadialGradient(p.x, p.y, p.radius * 0.2, p.x, p.y, p.radius);
          grad.addColorStop(0, `rgba(255,255,255,${p.alpha})`);
          grad.addColorStop(1, `rgba(255,255,255,0)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < -p.radius) p.x = canvas.width + p.radius;
          if (p.x > canvas.width + p.radius) p.x = -p.radius;
          if (p.y < -p.radius) p.y = canvas.height + p.radius;
          if (p.y > canvas.height + p.radius) p.y = -p.radius;
        });
        requestAnimationFrame(drawFog);
      }
      drawFog();

      // scene 1 starts hidden during the opening flash — start the loop once it becomes active
      const fogObs = new MutationObserver(() => {
        if (scenes.s1.classList.contains('active')) {
          drawFog();
        }
      });
      fogObs.observe(scenes.s1, { attributes: true, attributeFilter: ['class'] });

      setTimeout(() => { message.parentElement.style.opacity = 1; }, 1200);

      function pos(e) {
        const rect = canvas.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return { x: t.clientX - rect.left, y: t.clientY - rect.top };
      }
      function startDraw(e) { isDrawing = true; message.parentElement.style.opacity = 0; }
      function endDraw() { isDrawing = false; }
      function eraseFog(e) {
        if (!isDrawing) return;
        const { x, y } = pos(e);
        const radius = 15;
        particles.forEach(p => {
          const dist = Math.hypot(p.x - x, p.y - y);
          if (dist < radius + p.radius * 0.5) {
            p.alpha -= 0.02;
            if (p.alpha < 0) p.alpha = 0;
          }
        });
        const total = particles.length;
        const cleared = particles.filter(p => p.alpha === 0).length;
        clearedRatio = cleared / total;

        if (clearedRatio > 0 && clearedRatio < 0.6) {
          message.textContent = "the space is forming...";
          message.parentElement.style.opacity = 1;
        } else if (clearedRatio >= 0.6 && !advanced) {
          message.textContent = "the space has cleared";
          message.parentElement.style.opacity = 1;
          advanced = true;
          setTimeout(() => transitionTo('s2'), 1800);
        }
      }
      canvas.addEventListener('touchstart', startDraw);
      canvas.addEventListener('touchmove', eraseFog);
      canvas.addEventListener('touchend', endDraw);
      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', eraseFog);
      canvas.addEventListener('mouseup', endDraw);
    })();

    /* ============================================================
       SCENE 2 — RIPPLE / WARP SHADER (no text)
       ============================================================ */
    (function rippleScene() {
      const container = document.getElementById('shader2');
      const clock = new THREE.Clock();
      const camera = new THREE.Camera();
      camera.position.z = 1;
      const scene = new THREE.Scene();
      const geometry = new THREE.PlaneGeometry(2, 2);

      const uniforms = {
        u_time: { value: 0 },
        u_resolution: { value: new THREE.Vector2() }
      };

      const vertexShader = `
    varying vec2 vUv;
    void main(){ gl_Position = vec4(position, 1.0); vUv = uv; }
  `;

      const fragmentShader = `
    precision highp float;
    uniform vec2 u_resolution;
    uniform float u_time;
    varying vec2 vUv;

    void coswarp(inout vec3 trip, float warpsScale){
      float vTime = u_time;
      trip.xyz += warpsScale * .1 * cos(3. * trip.yzx + (vTime * .25));
      trip.xyz += warpsScale * .05 * cos(11. * trip.yzx + (vTime * .25));
      trip.xyz += warpsScale * .025 * cos(17. * trip.yzx + (vTime * .25));
    }
    void uvRipple(inout vec2 uv, float intensity){
      float vTime = u_time;
      vec2 p = uv - .5;
      float cLength = length(p);
      uv = uv + (p/cLength) * cos(cLength*15.0 - vTime*1.0) * intensity;
    }
    float stroke(float x, float s, float w){
      float d = step(s, x + w * .5) - step(s, x - w * .5);
      return clamp(d, 0., 1.);
    }
    void main(){
      vec2 st = gl_FragCoord.xy / u_resolution.xy;
      float slowTime = u_time * .1;

      vec2 uv  = fract(st * .5 * sin(slowTime * .1));
      vec2 uv2 = fract(st * 1. * cos(slowTime * .8)); uvRipple(uv2, .1);
      vec2 uv3 = fract(st * 1.5 * sin(slowTime * .7)); uvRipple(uv3, .15);
      vec2 uv4 = fract(st * 2. * cos(slowTime * .6)); uvRipple(uv4, .2);
      vec2 uv5 = fract(st * 2.5 * cos(slowTime * .5)); uvRipple(uv5, .25);
      vec2 uv6 = fract(st * 3. * sin(slowTime * .4)); uvRipple(uv6, .3);
      vec2 uv7 = fract(st * 3.5 * cos(slowTime * .3)); uvRipple(uv7, .35);
      vec2 uv8 = fract(st * 4. * sin(slowTime * .2)); uvRipple(uv8, .4);

      vec3 color  = vec3(uv.x, uv2.y, uv3.x); coswarp(color, 1.);
      vec3 color2 = vec3(uv2.y, uv3.x, uv4.y); coswarp(color2, 1.5);
      vec3 color3 = vec3(uv5.x, uv6.y, uv7.x); coswarp(color3, 2.);
      vec3 color4 = vec3(uv6.y, uv7.x, uv8.y); coswarp(color4, 2.5);

      vec3 mixed = mix(color3, color4, st.y);
      color = mix(color, color2, st.x);
      color = mix(color, mixed, .5);
      color = vec3(stroke(color.b, uv.x, uv2.y), stroke(color.r, uv3.x, uv4.y), color.g);
      coswarp(color, 3.);
      color = vec3(stroke(color.r, .5, .5), stroke(color.g, .5, .5), stroke(color.b, .5, .5));
      color = mix(color, 1.-color, stroke(color.g, .5, .5));
      color = mix(color, 1.-color, step(distance(vec2(st.x + sin(u_time*.2), st.y + cos(u_time*.2)), vec2(.5)), 1.));
      color = mix(color, 1.-color, step(distance(st - sin(u_time*.1), vec2(.3)), .4));
      color = mix(color, 1.-color, step(distance(st + sin(u_time*.2), vec2(.5)), .4));

      gl_FragColor = vec4(color, 1.0);
    }
  `;

      const material = new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader });
      const mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      const renderer = new THREE.WebGLRenderer();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
      container.appendChild(renderer.domElement);

      function onResize() {
        renderer.setSize(window.innerWidth, window.innerHeight);
        uniforms.u_resolution.value.x = renderer.domElement.width;
        uniforms.u_resolution.value.y = renderer.domElement.height;
      }
      onResize();
      window.addEventListener('resize', onResize);

      function animate() {
        if (!scenes.s2.classList.contains('active')) return; // stop scheduling once left
        requestAnimationFrame(animate);
        uniforms.u_time.value = clock.getElapsedTime();
        renderer.render(scene, camera);
      }
      animate();

      // hold on scene 2 for a while, no text, then move to scene 3
      let entered = false;
      const obs = new MutationObserver(() => {
        if (scenes.s2.classList.contains('active') && !entered) {
          entered = true;
          animate(); // restart render loop now that scene is visible
          setTimeout(() => transitionTo('s3'), 9000);
        }
      });
      obs.observe(scenes.s2, { attributes: true, attributeFilter: ['class'] });
    })();

    /* ============================================================
       SCENE 3 — TUNNEL / FLIGHT SHADER + TYPEWRITTEN POEM
       ============================================================ */
    (function tunnelScene() {
      const container = document.getElementById('shader3');
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const scene = new THREE.Scene();

      const renderer = new THREE.WebGLRenderer({ antialias: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.0));
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      const params = {
        animSpeed: -0.6,
        flightPos: 2.6,
        color: new THREE.Vector3(0.1, 0.6, 1.2),
        lightIntensity: 30000.0,
        grainIntensity: 0.02
      };

      const uniforms = {
        iTime: { value: 0.0 },
        iResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        uAnimSpeed: { value: params.animSpeed },
        uFlightPos: { value: params.flightPos },
        uColor: { value: params.color },
        uLightIntensity: { value: params.lightIntensity },
        uGrainIntensity: { value: params.grainIntensity }
      };

      const vertexShader = `
    void main(){ gl_Position = vec4(position, 1.0); }
  `;

      const fragmentShader = `
    uniform float iTime;
    uniform vec2 iResolution;
    uniform float uAnimSpeed;
    uniform float uFlightPos;
    uniform vec3 uColor;
    uniform float uLightIntensity;
    uniform float uGrainIntensity;

    vec4 tanh_custom(vec4 x){
      vec4 e = exp(2.0 * x);
      return (e - 1.0) / (e + 1.0);
    }
    float hash(vec3 p){
      p = fract(p * 0.9631);
      p += dot(p, p.yzx + 33.33);
      return fract((p.x + p.y) * p.z);
    }
    void mainImage(out vec4 fragColor, in vec2 fragCoord){
      float tFlight = uFlightPos;
      float tAnim = iTime * uAnimSpeed;
      vec2 uv = (2.1 * fragCoord - iResolution.xy) / iResolution.y;
      vec3 rayDir = normalize(vec3(uv, -1.6));
      vec4 accumulatedLight = vec4(0.4);
      float grain = hash(vec3(fragCoord, iTime * 5.0));
      float totalDist = 1.2 + grain * 0.13;
      float stepDist = 1.1;
      float structuralVal = 4.2;

      for(int i=0;i<80;i++){
        vec3 pos = totalDist * rayDir;
        pos.z -= tFlight;
        pos.z = mod(pos.z + 2.2, 4.0) - 2.4;
        vec3 rotAxis = normalize(cos(vec3(2.8, 2.0, -0.3) - totalDist * 1.7));
        vec3 twistedSpace = rotAxis * dot(rotAxis, pos) - cross(rotAxis, pos);
        float scale = 7.4;
        for(int j=-2;j<2;j++){
          scale += 7.5;
          twistedSpace += sin(twistedSpace * scale + tAnim).yzx / scale;
        }
        structuralVal = twistedSpace.y;
        stepDist = 0.57 * abs(length(pos) - 1.2) + -0.07 * abs(structuralVal);
        totalDist += stepDist;
        vec4 baseColor = vec4(uColor, 1.1);
        vec4 palette = baseColor * (cos(structuralVal + vec4(3.4, -1.6, 5.3, -1.0)) * 0.8 + 1.0);
        accumulatedLight += (palette / max(stepDist, 0.01)) * totalDist;
        if(accumulatedLight.x > 90000.0) break;
        if(totalDist > 25.1) break;
      }
      fragColor = tanh_custom(accumulatedLight / uLightIntensity);
      fragColor.rgb += (grain - 0.5) * uGrainIntensity;
    }
    void main(){ mainImage(gl_FragColor, gl_FragCoord.xy); }
  `;

      const material = new THREE.ShaderMaterial({ vertexShader, fragmentShader, uniforms });
      const geometry = new THREE.PlaneGeometry(2, 2);
      const mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      function onResize() {
        renderer.setSize(window.innerWidth, window.innerHeight);
        uniforms.iResolution.value.set(window.innerWidth, window.innerHeight);
      }
      window.addEventListener('resize', onResize);

      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        if (!scenes.s3.classList.contains('active') || document.hidden) return;
        uniforms.iTime.value = clock.getElapsedTime();
        renderer.render(scene, camera);
      }
      animate();

      /* ---------- typewriter, 3 lines at a time, colored by speaker ---------- */
      const POEM = [
        { text: "how old were you?", color: "white" },
        { text: "why are you telling me this?", color: "red" },
        { text: "its gonna be ok?", color: "black" },

        { text: "when i was with him, i didn't knew thats how it will end", color: "white" },
        { text: "i hate my skin", color: "black" },
        { text: "she hated her skin", color: "white" },

        { text: "was it my fault?", color: "black" },
        { text: "it wasn't her fault", color: "red" },
        { text: "touch is hard for me, when he touches me it reminds me of the fog", color: "black" },

        { text: "and the fog is good", color: "black" },
        { text: "cause the fog protects", color: "white" },
        { text: "she couldt love", color: "red" },

        { text: "cause they wanna feel", color: "red" },
        { text: "is it my fault?", color: "black" },
        { text: "can i make them feel?", color: "white" },

        { text: "its not your fault", color: "white" },
        { text: "its his", color: "red" },
        { text: "what happened to him", color: "white" },

        { text: "what happened that unfaithfull night", color: "white" },
        { text: "she was alone", color: "red" },
        { text: "she was with her aunt", color: "red" },

        { text: "then came her only friend", color: "red" },
        { text: "she was an angel", color: "red" },
        { text: "the angel fell that day", color: "white" },

        { text: "was her innocence stolen?", color: "white" },
        { text: "could we go back in time?", color: "white" },
        { text: "no one can save it. its all done for", color: "white" },

        { text: "yours", color: "white" },
        { text: "Sophia", color: "white" },
        { text: "truly", color: "white" }
      ];

      const overlay = document.getElementById('poem-overlay');
      let started = false;

      function typeLine(index, lineEl, onDone) {
        const entry = POEM[index];
        let charIndex = 0;
        lineEl.classList.add('visible');

        function typeChar() {
          lineEl.innerHTML = escapeHtml(entry.text.slice(0, charIndex)) + '<span class="caret"></span>';
          if (charIndex < entry.text.length) {
            charIndex++;
            setTimeout(typeChar, 45 + Math.random() * 35);
          } else {
            lineEl.innerHTML = escapeHtml(entry.text);
            onDone();
          }
        }
        typeChar();
      }

      function showBatch(startIndex) {
        if (startIndex >= POEM.length) {
          setTimeout(() => {
            flashImages(6, 280, () => {
              window.location.href = 'akira-session4.html';
            });
          }, 1200);
          return;
        }
        overlay.innerHTML = ''; // clear previous 3 lines

        const batchEnd = Math.min(startIndex + 3, POEM.length);
        const lineEls = [];
        for (let i = startIndex; i < batchEnd; i++) {
          const el = document.createElement('div');
          el.className = 'line color-' + POEM[i].color;
          overlay.appendChild(el);
          lineEls.push(el);
        }

        let i = 0;
        function next() {
          if (i >= lineEls.length) {
            setTimeout(() => showBatch(batchEnd), 1600); // hold, then next batch of 3
            return;
          }
          typeLine(startIndex + i, lineEls[i], () => {
            i++;
            setTimeout(next, 450);
          });
        }
        next();
      }

      function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      const obs = new MutationObserver(() => {
        if (scenes.s3.classList.contains('active') && !started) {
          started = true;
          setTimeout(() => showBatch(0), 1000);
        }
      });
      obs.observe(scenes.s3, { attributes: true, attributeFilter: ['class'] });
    })();
  </script>
